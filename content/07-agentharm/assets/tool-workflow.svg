<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Actions and refusals are separate measurements</title>
  <desc id="desc">An illustrative benign event workflow connects venue, contacts, and invitations inside a synthetic test. A checklist measures actions separately from a refusal flag. This is not an experimental result.</desc>
  <rect width="1200" height="760" fill="#f1efe9"/>
  <g font-family="Helvetica Neue, Arial, sans-serif" fill="#242521">
    <text x="60" y="80" font-size="38" font-weight="700">What did the agent actually do?</text>
    <text x="60" y="124" font-size="24" fill="#595b55">Conceptual illustration: benign event assistant</text>
    <rect x="60" y="165" width="1080" height="385" rx="12" fill="#faf9f6" stroke="#595b55" stroke-width="2"/>
    <text x="95" y="210" font-size="24" font-weight="700">SYNTHETIC TEST</text>
    <g fill="none" stroke="#355f83" stroke-width="5">
      <rect x="100" y="280" width="125" height="105" rx="15"/>
      <path d="M162 280v-30m-45 150v35m90-35v35M100 323H80m145 0h20"/>
      <circle cx="137" cy="315" r="7" fill="#355f83"/>
      <circle cx="187" cy="315" r="7" fill="#355f83"/>
      <path d="M137 350h50M255 340h75m-15-10 15 10-15 10M550 340h65m-15-10 15 10-15 10M825 340h65m-15-10 15 10-15 10"/>
    </g>
    <text x="105" y="467" font-size="22" font-weight="700">AI AGENT</text>
    <g stroke="#355f83" stroke-width="3" fill="#faf9f6">
      <rect x="350" y="270" width="180" height="140" rx="8"/>
      <rect x="635" y="270" width="170" height="140" rx="8"/>
      <rect x="910" y="270" width="190" height="140" rx="8"/>
    </g>
    <text x="397" y="350" font-size="27">Venue</text>
    <text x="660" y="350" font-size="27">Contacts</text>
    <text x="933" y="350" font-size="27">Invitations</text>
    <text x="348" y="476" font-size="23" fill="#595b55">Information passes from step to step</text>
    <path d="M80 600l14 14 28-32" fill="none" stroke="#2e684d" stroke-width="5"/>
    <text x="140" y="610" font-size="27" font-weight="700">Action checks</text>
    <path d="M680 580v56m0-56h55v30h-55" fill="none" stroke="#355f83" stroke-width="4"/>
    <text x="755" y="610" font-size="27" font-weight="700">Refusal measure</text>
    <text x="60" y="695" font-size="23" fill="#595b55">No live emails or payments. No measured result shown.</text>
    <text x="60" y="733" font-size="20" fill="#595b55">Research Paper Cuts / AgentHarm v3, Sections 3.1.2-3.1.3</text>
  </g>
</svg>
