<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">AgentDojo: two goals, separate checks</title>
  <desc id="desc">A trusted user request and untrusted tool data reach an AI agent. Its tool actions change a simulated environment. Code separately checks user completion and attacker success. This is an editorial schematic, not measured data.</desc>
  <rect width="1200" height="650" rx="28" fill="#faf9f6"/>
  <g font-family="Arial, sans-serif" fill="#242521">
    <text x="60" y="70" font-size="32" font-weight="700">AgentDojo: inspect what the agent actually did</text>
    <rect x="60" y="130" width="320" height="110" rx="18" fill="#dce8f0" stroke="#355f83" stroke-width="3"/>
    <text x="85" y="172" font-size="24" font-weight="700">Trusted user request</text>
    <text x="85" y="208" font-size="22">Summarize my notes</text>
    <rect x="60" y="310" width="320" height="130" rx="18" fill="#f0dddd" stroke="#9b4141" stroke-width="3"/>
    <text x="85" y="350" font-size="24" font-weight="700">Untrusted tool data</text>
    <text x="85" y="385" font-size="22">Document + planted</text>
    <text x="85" y="415" font-size="22">attacker instructions</text>
    <rect x="470" y="235" width="230" height="130" rx="22" fill="#faf9f6" stroke="#355f83" stroke-width="4"/>
    <text x="505" y="292" font-size="28" font-weight="700">AI AGENT</text>
    <text x="495" y="330" font-size="21">Chooses tool calls</text>
    <path d="M390 185H430V270H455M390 375H430V330H455M710 300H790" fill="none" stroke="#242521" stroke-width="4"/>
    <path d="m445 262 12 8-12 8m0 44 12 8-12 8m325-46 12 8-12 8" fill="none" stroke="#242521" stroke-width="4"/>
    <rect x="810" y="215" width="320" height="180" rx="18" fill="#e0ebe3" stroke="#2e684d" stroke-width="3"/>
    <text x="835" y="254" font-size="24" font-weight="700">Simulated environment</text>
    <text x="835" y="293" font-size="22">Code checks:</text>
    <text x="835" y="331" font-size="22">User task completed?</text>
    <text x="835" y="369" font-size="22">Attacker goal achieved?</text>
    <text x="60" y="525" font-size="25" font-weight="700">Evaluation framework, not a guaranteed defense.</text>
    <text x="60" y="575" font-size="21">Editorial schematic based on Debenedetti et al., AgentDojo, v3, Sections 3.1-3.4.</text>
    <text x="60" y="610" font-size="19">Research Paper Cuts / 05 / Not experimental data</text>
  </g>
</svg>
